version: '3.9'

services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle23-free
    environment:
      - ORACLE_PWD=oracle
    ports:
      - "1531:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: 
        - CMD-SHELL
        - |
          sqlplus -s system/oracle@//localhost:1521/FREEPDB1 << 'SQL'
            select 1 from dual;
          SQL
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 60s

  webapi:
    build: ./WebApplication15
    container_name: backend-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production   
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
        build: ./frontendapp
        container_name: react-frontend
        ports:
          - "5173:80"
        depends_on:
          - webapi

volumes:
  oracle-data: